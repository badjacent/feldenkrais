[project]
name = "feldenkrais"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.34",
    "groq>=1.0.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
mini = [
    "anthropic>=0.76,<1",
    "google-genai>=1.60,<2",
    "mlx-whisper>=0.4,<1",
    "openai>=2.15,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.2,<2",
    "yt-dlp[default]>=2025.12.8,<2027",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "responses>=0.25.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
