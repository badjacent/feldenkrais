[project]
name = "feldenkrais"
version = "0.1.0"
description = "Lesson ingestion, transcription, analysis, and conversation application"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "boto3>=1.42.34",
    "groq>=1.0.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "mangum>=0.17.0",
    "python-multipart>=0.0.6",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "uvicorn>=0.30",
    "python-docx>=1.1,<2",
    "numpy>=1.26"
]
worker = [
    "groq>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.32.5",
    "beautifulsoup4>=4.14.0",
    "yt-dlp>=2024.0.0"
]
transcription = ["mlx-whisper>=0.4,<1; sys_platform == 'darwin' and platform_machine == 'arm64'"]
mini = [
    "anthropic>=0.76,<1",
    "google-genai>=1.60,<2",
    "mlx-whisper>=0.4,<1",
    "openai>=2.15,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.2,<2",
    "yt-dlp[default]>=2025.12.8,<2027",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "responses>=0.25.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
