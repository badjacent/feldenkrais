<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 12px;
      color: #333;
    }
    h2 {
      margin: 0 0 8px;
      font-size: 15px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status.ok { background: #e8f5e9; color: #2e7d32; }
    .status.err { background: #fbe9e7; color: #c62828; }
    .status.loading { background: #fff3e0; color: #e65100; }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.ok { background: #4CAF50; }
    .dot.err { background: #f44336; }
    .dot.loading { background: #FF9800; }
    .captures {
      max-height: 260px;
      overflow-y: auto;
    }
    .capture {
      padding: 6px 0;
      border-bottom: 1px solid #eee;
    }
    .capture:last-child { border-bottom: none; }
    .capture-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .capture-meta {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }
    .capture-status {
      font-size: 11px;
      font-weight: 500;
    }
    .capture-status.sent { color: #4CAF50; }
    .capture-status.error { color: #f44336; }
    .capture-type {
      display: inline-block;
      font-size: 9px;
      font-weight: 600;
      padding: 1px 4px;
      border-radius: 3px;
      background: #e3f2fd;
      color: #1565c0;
      vertical-align: middle;
      margin-right: 3px;
    }
    .empty {
      color: #999;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h2>Feldenkrais Capture</h2>
  <div id="server-status" class="status loading">
    <span class="dot loading"></span>
    <span>Checking server...</span>
  </div>
  <div id="captures" class="captures">
    <div class="empty">No captures yet. Press Play on a lesson.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
